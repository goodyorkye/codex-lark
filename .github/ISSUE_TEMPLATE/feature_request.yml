name: Feature request
description: Suggest an improvement to the phone or Mac experience.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the friction before proposing an interface.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security or privacy considerations
