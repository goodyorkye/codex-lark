name: Release macOS preview

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm package:mac
      - name: Checksums
        run: shasum -a 256 release/*.zip > release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: codex-lark-macos
          path: |
            release/*.zip
            release/SHA256SUMS.txt
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: true
          files: |
            release/*.zip
            release/SHA256SUMS.txt
